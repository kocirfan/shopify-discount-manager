query CartLinesDiscountsGenerateRunInput {
  cart {
    lines {
      id
    }
    deliveryGroups {
      id
      selectedDeliveryOption {
        handle
        title
      }
    }
    # Checkout UI (delivery-tracker) tarafından set edilir: "pickup" | "shipping"
    attribute(key: "selected_delivery_type") {
      value
    }
  }
  # Discount Function API: merchant'ın bu indirim için açtığı sınıflar
  discount {
    discountClasses
  }
}
